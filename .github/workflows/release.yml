name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest ruff mypy

      - name: Require recorded live acceptance
        run: python tools/check_release_gate.py

      - name: Validate tag matches version.py
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = python -c "from version import __version__; print(__version__)"
          if ($tag -ne "v$version") {
            throw "Tag ($tag) does not match version.py (v$version)"
          }

      - name: Import smoke check
        shell: pwsh
        run: |
          python tools/check_runtime.py
          python -m ruff check .
          python -m pytest -q

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean SE_Tactical_Command.spec

      - name: Verify frozen runtime and shaders
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          $exe = (Resolve-Path "dist/SE_Tactical_Command_v$version.exe").Path
          $report = Join-Path $env:RUNNER_TEMP "sebx-frozen-selftest.json"
          $probe = Start-Process -FilePath $exe -ArgumentList @('--self-test', $report) -WindowStyle Hidden -PassThru -Wait
          if ($probe.ExitCode -ne 0) { throw "Frozen runtime check failed" }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.passed -or $result.version -ne $version) { throw "Invalid frozen metadata" }

      - name: Build portable distribution package
        shell: pwsh
        run: python package_release.py

      - name: Create release changelog body
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          $heading = "## v$version"
          $lines = Get-Content -Path RELEASE_NOTES.md
          $start = ($lines | Select-String -Pattern "^## v$([regex]::Escape($version))\b" | Select-Object -First 1).LineNumber
          if (-not $start) {
            throw "RELEASE_NOTES.md has no section starting with $heading"
          }
          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start - 1; $i -lt $lines.Count; $i++) {
            if ($i -gt ($start - 1) -and $lines[$i] -match '^## v') { break }
            $body.Add($lines[$i])
          }
          $text = ($body -join "`n").Trim() + "`n"
          Set-Content -Path release_body.md -Value $text -Encoding utf8
          Get-Content release_body.md

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path dist -Include *.exe,*.zip -Recurse
          if (-not $artifacts) { throw "No artifacts produced in dist/" }
          $lines = foreach ($item in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $item.FullName).Hash.ToLower()
            "$hash  $($item.Name)"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release_body.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

