name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Validate tag matches version.py
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = python -c "from version import __version__; print(__version__)"
          if ($tag -ne "v$version") {
            throw "Tag ($tag) does not match version.py (v$version)"
          }

      - name: Run tests
        shell: pwsh
        run: pytest -q

      - name: Build executable
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          pyinstaller --noconfirm --onefile --windowed `
            --name "SE_Tactical_Command_v$version" `
            --icon "app_icon.ico" `
            --add-data "README.md;." `
            --add-data "LICENSE;." `
            --add-data "RELEASE_NOTES.md;." `
            --add-data "profiles;profiles" `
            --add-data "data;data" `
            --add-data "app_icon.ico;." `
            --add-data "logo.png;." `
            gui_standalone.py

      - name: Create release changelog body
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          $heading = "## v$version"
          $lines = Get-Content -Path RELEASE_NOTES.md
          $start = ($lines | Select-String -Pattern "^## v$([regex]::Escape($version))\b" | Select-Object -First 1).LineNumber
          if (-not $start) {
            throw "RELEASE_NOTES.md has no section starting with $heading"
          }
          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start - 1; $i -lt $lines.Count; $i++) {
            if ($i -gt ($start - 1) -and $lines[$i] -match '^## v') { break }
            $body.Add($lines[$i])
          }
          $text = ($body -join "`n").Trim() + "`n"
          Set-Content -Path release_body.md -Value $text -Encoding utf8
          Get-Content release_body.md

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path dist -Filter *.exe
          if (-not $exes) { throw "No executables produced in dist/" }
          $lines = foreach ($exe in $exes) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLower()
            "$hash  $($exe.Name)"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release_body.md
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt

