[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = [".git", ".venv*", "build", "dist", "artifacts", "test_env"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv-release", ".venv-311", "build", "dist", "artifacts"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.mypy]
exclude = ["^\\.venv", "^build", "^dist"]
ignore_missing_imports = true
